<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Edson Feitosa de Oliveira Júnior" />

    <!--
      Tags que variam por página (title, description, canonical, og:title,
      og:description) são injetadas em runtime pelo componente <Seo> via
      react-helmet-async — ver src/components/Seo.tsx. Não duplicar aqui:
      o Helmet só sabe substituir tags que ele mesmo renderizou.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Edson Junior" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="https://perfilP1.prupru.org/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://perfilP1.prupru.org/og-image.svg" />

    <title>Edson Junior - Desenvolvedor Backend Java</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Edson Feitosa de Oliveira Júnior",
        "jobTitle": "Desenvolvedor Backend Java",
        "url": "https://perfilP1.prupru.org",
        "sameAs": [
          "https://www.linkedin.com/in/efojunior25/",
          "https://github.com/efojunior25"
        ],
        "knowsAbout": [
          "Java",
          "Spring Boot",
          "Microsserviços",
          "React",
          "AWS",
          "Análise de Dados"
        ]
      }
    </script>

    <!-- Contraparte do redirect em public/404.html (GitHub Pages + SPA) -->
    <script>
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + decoded + l.hash,
          )
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
